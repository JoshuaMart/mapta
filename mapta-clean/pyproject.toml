[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapta"
version = "2.0.0"
description = "MAPTA - autonomous multi-agent penetration testing agent"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    # The OpenRouter adapter drives this SDK against OpenRouter, never OpenAI.
    "openai>=3.0",
    # httpx 2.x under its new distribution name, as required by openai 3.x.
    "httpx2>=2.13",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mapta = "mapta.interface.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mapta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
packages = ["mapta"]
mypy_path = "src"
strict = true
warn_unused_ignores = false
